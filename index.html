<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>سودوکو مینی اپ</title>
                <script src="https://telegram.org/js/telegram-web-app.js"></script>
                    <style>
                            body {
                            	            font-family: Arial, sans-serif;
                            	                        background-color: #f0f2f5;
                            	                                    text-align: center;
                            	                                                margin: 0;
                            	                                                            padding: 20px;
                            	                                                                    }
                            	                                                                            h1 { color: #333; }
                            	                                                                                    #board {
                            	                                                                                    	            display: grid;
                            	                                                                                    	                        grid-template-columns: repeat(9, 40px);
                            	                                                                                    	                                    grid-template-rows: repeat(9, 40px);
                            	                                                                                    	                                                gap: 1px;
                            	                                                                                    	                                                            justify-content: center;
                            	                                                                                    	                                                                        margin: 20px auto;
                            	                                                                                    	                                                                                    background-color: #000;
                            	                                                                                    	                                                                                                width: 370px;
                            	                                                                                    	                                                                                                            padding: 2px;
                            	                                                                                    	                                                                                                                    }
                            	                                                                                    	                                                                                                                            .cell {
                            	                                                                                    	                                                                                                                            	            width: 40px;
                            	                                                                                    	                                                                                                                            	                        height: 40px;
                            	                                                                                    	                                                                                                                            	                                    background-color: #fff;
                            	                                                                                    	                                                                                                                            	                                                text-align: center;
                            	                                                                                    	                                                                                                                            	                                                            font-size: 20px;
                            	                                                                                    	                                                                                                                            	                                                                        font-weight: bold;
                            	                                                                                    	                                                                                                                            	                                                                                    border: none;
                            	                                                                                    	                                                                                                                            	                                                                                                outline: none;
                            	                                                                                    	                                                                                                                            	                                                                                                        }
                            	                                                                                    	                                                                                                                            	                                                                                                                /* مرزبندی بلاک‌های ۳ در ۳ */
                            	                                                                                    	                                                                                                                            	                                                                                                                        .cell:nth-child(3n) { border-left: 2px solid #000; }
                            	                                                                                    	                                                                                                                            	                                                                                                                                .cell:nth-child(9n+1) { border-right: 2px solid #000; }
                            	                                                                                    	                                                                                                                            	                                                                                                                                        tr:nth-child(3n) .cell { border-bottom: 2px solid #000; }
                            	                                                                                    	                                                                                                                            	                                                                                                                                            </style>
                            	                                                                                    	                                                                                                                            	                                                                                                                                            </head>
                            	                                                                                    	                                                                                                                            	                                                                                                                                            <body>

                            	                                                                                    	                                                                                                                            	                                                                                                                                                <h1>بازی سودوکو</h1>
                            	                                                                                    	                                                                                                                            	                                                                                                                                                    <div id="board"></div>

                            	                                                                                    	                                                                                                                            	                                                                                                                                                        <script>
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                // دکمه‌های تلگرام رو ست می‌کنیم
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                        const tg = window.Telegram.WebApp;
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                tg.ready();
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                        tg.expand(); // مینی اپ تمام صفحه بشه

                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                // یک ماتریس ساده سودوکو (برای تست، صفرها خالی هستن)
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        const sampleBoard = [
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	            [5, 3, 0, 0, 7, 0, 0, 0, 0],
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                        [6, 0, 0, 1, 9, 5, 0, 0, 0],
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                    [0, 9, 8, 0, 0, 0, 0, 6, 0],
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                [8, 0, 0, 0, 6, 0, 0, 0, 3],
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                            [4, 0, 0, 8, 0, 3, 0, 0, 1],
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                        [7, 0, 0, 0, 2, 0, 0, 0, 6],
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                    [0, 6, 0, 0, 0, 0, 2, 8, 0],
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                [0, 0, 0, 4, 1, 9, 0, 0, 5],
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                            [0, 0, 0, 0, 8, 0, 0, 7, 9]
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                                    ];

                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                                            const boardDiv = document.getElementById('board');

                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                                                    // ساختن گرافیکی صفحه سودوکو
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                                                            for (let r = 0; r < 9; r++) {
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                                                            	            for (let c = 0; c < 9; c++) {
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                                                            	            	                let input = document.createElement('input');
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                                                            	            	                                input.type = 'number';
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                                                            	            	                                                input.className = 'cell';
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                                                            	            	                                                                input.min = 1;
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                                                            	            	                                                                                input.max = 9;

                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                                                            	            	                                                                                                                if (sampleBoard[r][c] !== 0) {
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                                                            	            	                                                                                                                	                    input.value = sampleBoard[r][c];
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                                                            	            	                                                                                                                	                                        input.disabled = true; // اعداد ثابت غیرقابل تغییر باشن
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                                                            	            	                                                                                                                	                                                            input.style.backgroundColor = '#e0e0e0';
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                                                            	            	                                                                                                                	                                                                            }

                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                                                            	            	                                                                                                                	                                                                                                            boardDiv.appendChild(input);
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                                                            	            	                                                                                                                	                                                                                                                        }
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                                                            	            	                                                                                                                	                                                                                                                                }
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                                                            	            	                                                                                                                	                                                                                                                                    </script>
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                                                            	            	                                                                                                                	                                                                                                                                    </body>
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                                                            	            	                                                                                                                	                                                                                                                                    </html>

                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                                                            	            	                                                                                                                	                                                                                                                                    
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                                                            	            	                                                                                                                }
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                                                            	            }
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        	                                                                                                                                            }
                            	                                                                                    	                                                                                                                            	                                                                                                                                                                                                        ]
                            	                                                                                    	                                                                                                                            }
                            	                                                                                    }
                            }
