<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>سودوکو مینی اپ</title>
                <script src="https://telegram.org/js/telegram-web-app.js"></script>
                    <style>
                            body {
                            	            font-family: Tahoma, sans-serif;
                            	                        background-color: #f4f6f9;
                            	                                    text-align: center;
                            	                                                margin: 0;
                            	                                                            padding: 10px;
                            	                                                                        user-select: none;
                            	                                                                                }
                            	                                                                                        h1 {
                            	                                                                                        	            color: #333;
                            	                                                                                        	                        font-size: 24px;
                            	                                                                                        	                                    margin-bottom: 10px;
                            	                                                                                        	                                            }
                            	                                                                                        	                                                    #board {
                            	                                                                                        	                                                    	            display: grid;
                            	                                                                                        	                                                    	                        grid-template-columns: repeat(9, 1fr);
                            	                                                                                        	                                                    	                                    gap: 1px;
                            	                                                                                        	                                                    	                                                max-width: 360px;
                            	                                                                                        	                                                    	                                                            margin: 15px auto;
                            	                                                                                        	                                                    	                                                                        background-color: #333;
                            	                                                                                        	                                                    	                                                                                    border: 3px solid #000;
                            	                                                                                        	                                                    	                                                                                                padding: 2px;
                            	                                                                                        	                                                    	                                                                                                            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
                            	                                                                                        	                                                    	                                                                                                                    }
                            	                                                                                        	                                                    	                                                                                                                            .cell {
                            	                                                                                        	                                                    	                                                                                                                            	            aspect-ratio: 1;
                            	                                                                                        	                                                    	                                                                                                                            	                        background-color: #fff;
                            	                                                                                        	                                                    	                                                                                                                            	                                    text-align: center;
                            	                                                                                        	                                                    	                                                                                                                            	                                                font-size: 18px;
                            	                                                                                        	                                                    	                                                                                                                            	                                                            font-weight: bold;
                            	                                                                                        	                                                    	                                                                                                                            	                                                                        border: 1px solid #e0e0e0;
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                    outline: none;
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                box-sizing: border-box;
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                            -moz-appearance: textfield;
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                    }
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                            .cell::-webkit-outer-spin-button,
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    .cell::-webkit-inner-spin-button {
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	            -webkit-appearance: none;
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                        margin: 0;
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                }
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                        /* مرزبندی بلاک‌های ۳ در ۳ */
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                .cell:nth-child(3n) { border-right: 2px solid #000; }
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                        .cell:nth-child(9n+1) { border-left: 1px solid #000; }

                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                        /* رنگ‌آمیزی وضعیت‌ها */
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                .fixed { background-color: #f0f0f0; color: #111; }
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                        .user-input { color: #0056b3; background-color: #fff; }
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                .error { background-color: #ffcccc !important; color: #cc0000; }

                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                .btn-container {
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	            margin-top: 15px;
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                        display: flex;
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                    justify-content: center;
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                gap: 10px;
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                        }
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                button {
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	            padding: 10px 20px;
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                        font-size: 16px;
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                    font-weight: bold;
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                border: none;
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                            border-radius: 8px;
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                        cursor: pointer;
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                    background-color: #2481cc;
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                color: white;
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                    }
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                            button:active { transform: scale(0.98); }
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                    .btn-reset { background-color: #6c757d; }
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                        </style>
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                        </head>
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                        <body>

                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                            <h1>بازی سودوکو</h1>
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                <div id="board"></div>

                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                    <div class="btn-container">
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                            <button onclick="checkSolution()">بررسی جواب</button>
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                    <button class="btn-reset" onclick="startNewGame()">بازی جدید</button>
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                        </div>

                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                            <script>
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                    const tg = window.Telegram.WebApp;
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                            tg.ready();
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                    tg.expand();

                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                            let solution = [];
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                    let currentBoard = [];

                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                            // یک مینی‌سورس آماده برای تولید جدول سودوکو سنتی
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    const baseSolutions = [
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            [
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                [5,3,4,6,7,8,9,1,2], [6,7,2,1,9,5,3,4,8], [1,9,8,3,4,2,5,6,7],
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                [8,5,9,7,6,1,4,2,3], [4,2,6,8,5,3,7,9,1], [7,1,3,9,2,4,8,5,6],
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                [9,6,1,5,3,7,2,8,4], [2,8,7,4,1,9,6,3,5], [3,4,5,2,8,6,1,7,9]
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                            ],
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        [
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                [1,2,3,4,5,6,7,8,9], [4,5,6,7,8,9,1,2,3], [7,8,9,1,2,3,4,5,6],
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                [2,3,4,5,6,7,8,9,1], [5,6,7,8,9,1,2,3,4], [8,9,1,2,3,4,5,6,7],
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                                [3,4,5,6,7,8,9,1,2], [6,7,8,9,1,2,3,4,5], [9,1,2,3,4,5,6,7,8]
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                                            ]
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                                                    ];

                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                                                            function startNewGame() {
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                                                            	            const boardDiv = document.getElementById('board');
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                                                            	                        boardDiv.innerHTML = '';

                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                                                            	                                                // انتخاب تصادفی یکی از الگوها
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                                                            	                                                            const puzzleIndex = Math.floor(Math.random() * baseSolutions.length);
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                                                            	                                                                        solution = JSON.parse(JSON.stringify(baseSolutions[puzzleIndex]));
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                                                            	                                                                                    currentBoard = JSON.parse(JSON.stringify(solution));

                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                                                            	                                                                                                // خالی کردن برخی خانه‌ها به صورت رندوم برای ایجاد معما (سطح متوسط)
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                                                            	                                                                                                            for (let r = 0; r < 9; r++) {
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                                                            	                                                                                                            	                for (let c = 0; c < 9; c++) {
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                                                            	                                                                                                            	                	                    if (Math.random() > 0.4) { 
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                                                            	                                                                                                            	                	                                            currentBoard[r][c] = 0;
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                                                            	                                                                                                            	                	                                                                }
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                                                            	                                                                                                            	                	                                                                                }
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                                                            	                                                                                                            	                	                                                                                            }

                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                                                            	                                                                                                            	                	                                                                                                        // رندر کردن گرافیکی در صفحه
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                                                            	                                                                                                            	                	                                                                                                                    for (let r = 0; r < 9; r++) {
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                                                            	                                                                                                            	                	                                                                                                                    	                for (let c = 0; c < 9; c++) {
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                                                            	                                                                                                            	                	                                                                                                                    	                	                    let input = document.createElement('input');
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                                                            	                                                                                                            	                	                                                                                                                    	                	                                        input.type = 'number';
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                                                            	                                                                                                            	                	                                                                                                                    	                	                                                            input.className = 'cell';
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                                                            	                                                                                                            	                	                                                                                                                    	                	                                                                                input.dataset.row = r;
                            	                                                                                        	                                                    	                                                                                                                            	                                                                                                                                    	                                                                                                                	                                                                	                                                                                                                                                                                                                                    	            	                                                                        	                                                                            	                                                                                                            	                	                                                                                                                    	                	                                                                                                    input.dataset.col = c;
